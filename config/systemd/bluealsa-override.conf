[Service]
# 2026-10-02: Bluetooth 再生途切れ（buffer underrun）対策。
#
# 実測で判明した問題:
#   - unit は --io-rt-priority=90 を渡しているが、chrt -p の実測は
#     SCHED_OTHER / 優先順位 0 だった（RT 化が効いていない）
#   - 原因は LimitRTPRIO 未指定。RLIMIT_RTPRIO=0 のプロセスは
#     CAP_SYS_NICE を渡しても sched_setscheduler が EPERM になる
#   - WiFi が 2.4GHz ch8 (2447MHz) で BT A2DP と同一帯域、干渉で
#     A2DP パケットが遅延したとき、RT でないと IO を即時処理できない
#
# LimitRTPRIO=99 を指定して --io-rt-priority=90 が実際に効くようにする。
AmbientCapabilities=CAP_SYS_NICE
CapabilityBoundingSet=CAP_SYS_NICE
RestrictRealtime=false
LimitRTPRIO=99
LimitMEMLOCK=infinity
ExecStart=
ExecStart=/usr/bin/bluealsa -p a2dp-source -p a2dp-sink -p hfp-ag -p hsp-ag -c LDAC -c SBC -S --io-rt-priority=90
