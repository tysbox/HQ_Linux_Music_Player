[Service]
# HQ Linux Music Player — MPD の CPU アフィニティ分離（音切れ対策）
#
# 2026-10-22 追加: USB コントローラの割り込み (IRQ xhci_hcd) を CPU0 に
#   退避させ（udev ルール scripts/99-xhci-irq-affinity.rules）、
#   オーディオ出力スレッド (rtio / output:ALSA Loopback) は CPU1,3 に固定して
#   競合を避ける。同一 CPU 上に irq ハンドラと出力スレッドが居ると、
#   割り込み遅延で再生が途切れる（音切れ）。
#
# 既存の priority.conf (Nice=-15) は併用する。
#
# 設置方法:
#   sudo install -m 0644 config/systemd/mpd.service.d/affinity.conf \
#     /etc/systemd/system/mpd.service.d/affinity.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart mpd.service
#
# README §12-6 (IRQ 固定と CPU アフィニティ分離) 参照。
CPUAffinity=1 3
